    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:site_name" content="Exam Munnodi" />
    <meta property="og:title" content="Exam Munnodi - A/L Exam Practice for Sri Lankan Students" />

      property="og:description"
      content="Practise papers, topic exams, and mock exams with progress tracking focused on mastery."

    <meta name="twitter:card" content="summary_large_image" />

      content="Practise papers, topic exams, and mock exams with progress tracking focused on mastery."
    />
    <meta name="twitter:image" content="https://www.exammunnodi.com/images/social-preview.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Exam Munnodi",
        "url": "https://www.exammunnodi.com/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "A/L exam practice and progress tracking for Sri Lankan students.",
        "inLanguage": "en",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "LKR"
        }
      }
    </script>
  </head>
  <body>
    <script>
      (() => {
        const storageKey = 'exam_munnodi_theme_mode';
        let storedMode = null;
        try {
          storedMode = localStorage.getItem(storageKey);
        } catch {
          storedMode = null;
        }
        const mode = storedMode === 'light' || storedMode === 'dark' || storedMode === 'system'
          ? storedMode
          : 'system';
        const resolvedMode = mode === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;

        document.documentElement.dataset.themeMode = mode;
        document.documentElement.dataset.theme = resolvedMode;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', resolvedMode === 'dark' ? '#0f172a' : '#f8fafc');
        document
          .querySelector('#app-favicon')
          ?.setAttribute('href', resolvedMode === 'dark' ? '/EM_DARK.png' : '/EM_Logo.png');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
